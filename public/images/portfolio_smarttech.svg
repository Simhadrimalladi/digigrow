<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="st-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="st-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Browser header -->
  <rect width="600" height="380" rx="12" fill="#ffffff" />
  <rect width="600" height="32" rx="12" fill="#f8fafc" />
  <rect y="24" width="600" height="8" fill="#f8fafc" />
  <circle cx="20" cy="16" r="5" fill="#ef4444" />
  <circle cx="36" cy="16" r="5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="5" fill="#10b981" />
  <rect x="80" y="8" width="440" height="16" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text x="300" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">smarttech.cloud</text>

  <!-- Website Body -->
  <g transform="translate(0, 32)">
    <rect width="600" height="185" fill="url(#st-bg)" />
    <!-- Nav bar -->
    <rect x="30" y="16" width="22" height="22" rx="6" fill="#3b82f6" />
    <text x="60" y="31" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff">SmartTech</text>
    <rect x="370" y="22" width="35" height="8" rx="2" fill="#94a3b8" />
    <rect x="420" y="22" width="40" height="8" rx="2" fill="#94a3b8" />
    <rect x="475" y="22" width="35" height="8" rx="2" fill="#94a3b8" />
    <rect x="525" y="15" width="45" height="22" rx="11" fill="url(#st-blue)" />

    <!-- Hero Content -->
    <text x="30" y="82" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff">AI-POWERED CLOUD</text>
    <text x="30" y="108" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#38bdf8">INTELLIGENCE PLATFORM</text>
    <text x="30" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Automate analytics, unify data pipelines, and scale seamlessly.</text>
    <rect x="30" y="146" width="100" height="24" rx="12" fill="url(#st-blue)" />
    <text x="80" y="162" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">Start Free Trial</text>

    <!-- Cloud Dashboard UI element -->
    <g transform="translate(370, 50)">
      <rect width="200" height="120" rx="8" fill="#1e293b" stroke="#334155" />
      <rect x="15" y="15" width="50" height="40" rx="6" fill="#3b82f6" opacity="0.2" />
      <text x="22" y="38" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#60a5fa">+99.9%</text>
      <rect x="75" y="15" width="110" height="40" rx="6" fill="#0f172a" />
      <!-- Line chart -->
      <polyline points="85,45 110,32 135,38 160,25 175,20" fill="none" stroke="#38bdf8" stroke-width="2" />
      <rect x="15" y="65" width="170" height="42" rx="4" fill="#0f172a" />
      <rect x="25" y="75" width="80" height="6" rx="2" fill="#94a3b8" />
      <rect x="25" y="88" width="140" height="8" rx="4" fill="#3b82f6" />
    </g>

    <!-- Bottom Feature Cards -->
    <rect y="185" width="600" height="163" fill="#f8fafc" />
    <rect x="30" y="205" width="165" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect x="45" y="220" width="36" height="36" rx="8" fill="#dbeafe" />
    <rect x="45" y="268" width="90" height="10" rx="3" fill="#0f172a" />
    <rect x="45" y="286" width="135" height="8" rx="2" fill="#94a3b8" />

    <rect x="215" y="205" width="165" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect x="230" y="220" width="36" height="36" rx="8" fill="#ede9fe" />
    <rect x="230" y="268" width="105" height="10" rx="3" fill="#0f172a" />
    <rect x="230" y="286" width="135" height="8" rx="2" fill="#94a3b8" />

    <rect x="400" y="205" width="170" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect x="415" y="220" width="36" height="36" rx="8" fill="#ccfbf1" />
    <rect x="415" y="268" width="115" height="10" rx="3" fill="#0f172a" />
    <rect x="415" y="286" width="140" height="8" rx="2" fill="#94a3b8" />
  </g>
</svg>
