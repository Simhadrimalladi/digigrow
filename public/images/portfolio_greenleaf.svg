<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="gl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gl-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Browser window header -->
  <rect width="600" height="380" rx="12" fill="#ffffff" />
  <rect width="600" height="32" rx="12" fill="#f1f5f9" />
  <rect y="24" width="600" height="8" fill="#f1f5f9" />
  <circle cx="20" cy="16" r="5" fill="#ef4444" />
  <circle cx="36" cy="16" r="5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="5" fill="#10b981" />
  <rect x="80" y="8" width="440" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0" />
  <text x="300" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">greenleafagro.com</text>

  <!-- Website Body -->
  <g transform="translate(0, 32)">
    <!-- Hero Banner -->
    <rect width="600" height="180" fill="url(#gl-bg)" />
    <!-- Nav bar -->
    <rect x="30" y="16" width="90" height="14" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="360" y="18" width="40" height="10" rx="3" fill="#ffffff" opacity="0.7" />
    <rect x="415" y="18" width="45" height="10" rx="3" fill="#ffffff" opacity="0.7" />
    <rect x="475" y="18" width="40" height="10" rx="3" fill="#ffffff" opacity="0.7" />
    <rect x="525" y="14" width="45" height="18" rx="9" fill="url(#gl-accent)" />

    <!-- Hero Content -->
    <text x="30" y="80" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff">SUSTAINABLE AGRO</text>
    <text x="30" y="106" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#facc15">SOLUTIONS &amp; CROPS</text>
    <text x="30" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">Empowering smart farming with organic technology</text>
    <rect x="30" y="144" width="95" height="24" rx="12" fill="url(#gl-accent)" />
    <text x="77" y="160" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#064e3b" text-anchor="middle">Explore Products</text>

    <!-- Field Illustration Graphic -->
    <path d="M 380 180 Q 450 100 520 180 Z" fill="#047857" opacity="0.6" />
    <path d="M 440 180 Q 510 120 600 180 Z" fill="#065f46" opacity="0.8" />
    <circle cx="510" cy="90" r="28" fill="#fef08a" opacity="0.8" />

    <!-- Bottom Cards -->
    <rect x="30" y="200" width="165" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <rect x="45" y="215" width="40" height="40" rx="8" fill="#dcfce7" />
    <rect x="45" y="265" width="100" height="10" rx="3" fill="#0f172a" />
    <rect x="45" y="282" width="135" height="8" rx="3" fill="#94a3b8" />

    <rect x="215" y="200" width="165" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <rect x="230" y="215" width="40" height="40" rx="8" fill="#fef9c3" />
    <rect x="230" y="265" width="110" height="10" rx="3" fill="#0f172a" />
    <rect x="230" y="282" width="135" height="8" rx="3" fill="#94a3b8" />

    <rect x="400" y="200" width="170" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <rect x="415" y="215" width="40" height="40" rx="8" fill="#e0e7ff" />
    <rect x="415" y="265" width="120" height="10" rx="3" fill="#0f172a" />
    <rect x="415" y="282" width="140" height="8" rx="3" fill="#94a3b8" />
  </g>
</svg>
