<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="elite-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#292524" />
      <stop offset="100%" stop-color="#44403c" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Browser window header -->
  <rect width="600" height="380" rx="12" fill="#18181b" />
  <rect width="600" height="32" rx="12" fill="#27272a" />
  <rect y="24" width="600" height="8" fill="#27272a" />
  <circle cx="20" cy="16" r="5" fill="#ef4444" />
  <circle cx="36" cy="16" r="5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="5" fill="#10b981" />
  <rect x="80" y="8" width="440" height="16" rx="8" fill="#18181b" stroke="#3f3f46" />
  <text x="300" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#a1a1aa" text-anchor="middle">eliteinteriors.design</text>

  <!-- Website Body -->
  <g transform="translate(0, 32)">
    <rect width="600" height="190" fill="url(#elite-bg)" />
    <!-- Nav bar -->
    <text x="30" y="28" font-family="'Georgia', serif" font-weight="700" font-size="14" fill="#f59e0b" letter-spacing="2">ELITE INTERIORS</text>
    <rect x="360" y="20" width="40" height="8" rx="2" fill="#a1a1aa" />
    <rect x="415" y="20" width="45" height="8" rx="2" fill="#a1a1aa" />
    <rect x="475" y="20" width="40" height="8" rx="2" fill="#a1a1aa" />
    <rect x="525" y="14" width="45" height="20" rx="4" fill="url(#gold-accent)" />

    <!-- Hero Content -->
    <text x="30" y="90" font-family="'Georgia', serif" font-size="24" fill="#ffffff">Crafting Timeless</text>
    <text x="30" y="118" font-family="'Georgia', serif" font-size="24" fill="#fbbf24" font-style="italic">Luxury Living Spaces</text>
    <text x="30" y="142" font-family="system-ui, sans-serif" font-size="11" fill="#d4d4d8">Award-winning interior architecture for villas &amp; penthouses</text>
    <rect x="30" y="156" width="105" height="24" rx="4" fill="url(#gold-accent)" />
    <text x="82" y="172" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#18181b" text-anchor="middle">View Portfolio</text>

    <!-- Interior Living Room Mockup Art -->
    <g transform="translate(360, 45)">
      <rect width="210" height="135" rx="8" fill="#52525b" opacity="0.4" />
      <rect x="15" y="30" width="180" height="70" rx="6" fill="#71717a" opacity="0.6" />
      <circle cx="160" cy="50" r="18" fill="#fef08a" opacity="0.3" />
      <rect x="35" y="65" width="140" height="35" rx="4" fill="#d97706" opacity="0.8" />
    </g>

    <!-- Bottom Showcase row -->
    <rect y="190" width="600" height="158" fill="#09090b" />
    <rect x="30" y="210" width="165" height="115" rx="6" fill="#18181b" stroke="#27272a" />
    <rect x="45" y="225" width="135" height="55" rx="4" fill="#27272a" />
    <rect x="45" y="290" width="80" height="8" rx="2" fill="#fbbf24" />

    <rect x="215" y="210" width="165" height="115" rx="6" fill="#18181b" stroke="#27272a" />
    <rect x="230" y="225" width="135" height="55" rx="4" fill="#27272a" />
    <rect x="230" y="290" width="90" height="8" rx="2" fill="#fbbf24" />

    <rect x="400" y="210" width="170" height="115" rx="6" fill="#18181b" stroke="#27272a" />
    <rect x="415" y="225" width="140" height="55" rx="4" fill="#27272a" />
    <rect x="415" y="290" width="100" height="8" rx="2" fill="#fbbf24" />
  </g>
</svg>
